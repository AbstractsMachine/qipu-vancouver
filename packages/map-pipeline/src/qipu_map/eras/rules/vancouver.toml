# Vancouver's era rules, as the map at qipu.org/vancouver uses them.
#
# Two rules need no entry here because the data carries them, and both are SOURCED:
#   a building stands from its tax-roll year built (City of Vancouver property tax report, BC Assessment year_built);
#   a building is gone from its lot's demolition permit date (City of Vancouver issued building permits, 2017 on).
# Everything below says whether it is sourced or a convention.

city = "ca/vancouver"

[undated]
basis = "convention"
why = "2,572 footprints have no year (parks, schools, exempt land); their neighbours' median is the best guess, capped at the footprint survey"
radii_m = [60, 120, 250]
cap_year = 2015
fallback_year = 1950
# A tower with no year never takes an old neighbourhood's median: every dated building over 30 m in the West End sample is
# from 1961 or later, except a 1928 front with a 1989 tower behind it (see [improved]).
tall_m = 30
tall_floor_year = 1960

[improved]
basis = "sourced"
why = "the roll's big-improvement year dates a tower added to an older building on the same footprint"
tall_m = 30

[standins]
basis = "convention"
why = "the tax roll only knows today's buildings, so without stand-ins the West End is empty in 1930 and 1950 where the air photos show it full"
radius_m = 80.0
min_neighbours = 6
old_share = 0.6
gap_years = 25
fallback_year = 1910
default_height_m = 9.0
early_year = 1930
early_max_height_m = 14.0
evidence_threshold = 0.3
evidence_margin_years = 5
max_overlap = 0.3
# a tower's footprint becomes a row of houses on the city's 33 by 122 ft lots, not one slab
lot_width_m = 10.0
lot_depth_m = 37.0
split_over_m2 = 300.0

[streets]
# CONVENTION: OpenStreetMap gives no opening year for Vancouver's rail lines; an undated SkyTrain line on a 1950 map is
# worse than a missing freight spur, so undated rails stand only today.
undated_rail_in_past = false

# Built-up masks from the National Air Photo Library's Salish mosaics (NRCan, Open Government Licence - Canada).
# The 1950 photos speak for 1930 to 1954: nothing older covers the whole city.
[[evidence]]
name = "napl1950"
photo_year = 1950
first_year = 1930
last_year = 1954
source = "NRCan National Air Photo Library, napl-salish 1950 mosaic"

[[evidence]]
name = "napl1959"
photo_year = 1959
first_year = 1955
last_year = 1962
source = "NRCan National Air Photo Library, napl-salish 1959 mosaic"

# Bridges standing today, with their opening years (Wikidata P1619, CC0, read 5 Oct 2026).
[[dated]]
what = "Burrard Bridge"
layer = "streets"
basis = "sourced"
source = "Wikidata Q919808, opened 1 July 1932"
names = ["Burrard Bridge", "Burrard Street Bridge"]
opened = 1932


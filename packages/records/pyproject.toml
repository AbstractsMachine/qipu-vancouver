[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qipu-records"
version = "0.1.0"
description = "Decision records from scanned council minutes on the Internet Archive"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Sociology :: History",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
anthropic = ["anthropic==2.3.0"]
openai = ["openai==3.38.0"]

[project.scripts]
qipu-records = "qipu_records.cli:main"

[project.urls]
Source = "https://github.com/AbstractsMachine/qipu-open/tree/main/packages/records"
Documentation = "https://github.com/AbstractsMachine/qipu-open/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qipu_records = ["py.typed"]
"qipu_records.read" = ["prompts/*.txt"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib --strict-markers"
markers = ["e2e: runs make demo and drives the map page in a headless browser (needs Playwright and the network)"]

[tool.coverage.run]
source = ["qipu_records"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

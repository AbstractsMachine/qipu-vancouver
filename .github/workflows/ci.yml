name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. On main every commit gets its own run: the path filter compares
# each push with the one before it, so a cancelled run would leave its changes untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Which packages a change touches. A change to shared files (CI, root config, examples) runs every package.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      records: ${{ steps.diff.outputs.records }}
      map-pipeline: ${{ steps.diff.outputs.map-pipeline }}
      viewer: ${{ steps.diff.outputs.viewer }}
      updates: ${{ steps.diff.outputs.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BASE" HEAD)
          fi
          shared='^(\.github/|Makefile$|ruff\.toml$|eslint\.config\.mjs$|\.prettierrc\.json$|examples/)'
          for package in records map-pipeline viewer; do
            if printf '%s\n' "$changed" | grep -qE "^packages/$package/|$shared"; then
              echo "$package=true" >> "$GITHUB_OUTPUT"
            else
              echo "$package=false" >> "$GITHUB_OUTPUT"
            fi
          done
          # updates runs records, so a change to records runs its jobs too
          if printf '%s\n' "$changed" | grep -qE "^packages/(updates|records)/|^docs/updates\.md$|$shared"; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates=false" >> "$GITHUB_OUTPUT"
          fi

  # ---- packages/records ----

  records-check:
    needs: changes
    if: needs.changes.outputs.records == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    defaults:
      run:
        working-directory: packages/records
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/records/requirements-dev.txt
      - run: make install PYTHON=python
      - name: lint, types, unit and integration tests with coverage
        run: make check
      - name: coverage in the job summary
        run: |
          { echo "### records coverage, Python ${{ matrix.python-version }}"; .venv/bin/coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      - name: the demo runs with no key and no network
        run: make demo
      - name: the wheel builds and carries its prompts
        run: make build

  records-e2e:
    needs: changes
    if: needs.changes.outputs.records == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/records
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/records/requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/records/requirements-dev.txt') }}
      - run: make install PYTHON=python
      - name: make demo, then the map preview in headless Chromium
        run: make e2e

  # ---- packages/updates ----

  updates-check:
    needs: changes
    if: needs.changes.outputs.updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/updates/requirements-dev.txt
      - run: make install PYTHON=python
      - name: lint, types, unit and integration tests with coverage
        run: make check
      - name: coverage in the job summary
        run: |
          { echo "### updates coverage, Python ${{ matrix.python-version }}"; .venv/bin/coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      - name: two scheduled runs on the sample, the second processing only the new meeting
        run: make demo

  updates-e2e:
    needs: changes
    if: needs.changes.outputs.updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/updates/requirements-dev.txt
      - run: make install PYTHON=python
      - name: the scheduled workflow's run step, executed as GitHub runs it (dry run, then two days)
        run: make e2e

  # ---- packages/map-pipeline ----

  map-pipeline-check:
    needs: changes
    if: needs.changes.outputs.map-pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/map-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/map-pipeline/requirements-dev.txt
      - run: make install PYTHON=python
      - name: lint, types, unit and integration tests with coverage
        run: make check
      - name: coverage in the job summary
        run: |
          { echo "### map-pipeline coverage, Python ${{ matrix.python-version }}"; .venv/bin/coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      - name: the wheel builds and carries the city file and the prompts
        run: make build

  map-pipeline-e2e:
    needs: changes
    if: needs.changes.outputs.map-pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/map-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/map-pipeline/requirements-dev.txt
      - run: make install PYTHON=python
      - name: every stage on the West End sample, with the CPU stand-ins for Blender and the image model
        run: make e2e



  # ---- packages/viewer ----

  viewer-check:
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/viewer/package-lock.json
      - run: make install
      - name: lint, format, types, unit and component tests with coverage
        run: make check
      - name: coverage in the job summary
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            console.log("### viewer coverage\n\n| | % |\n|---|---|");
            for (const k of ["lines", "statements", "functions", "branches"]) console.log(`| ${k} | ${t[k].pct} |`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: library and demo build
        run: make build

  viewer-e2e:
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/viewer/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/viewer/package-lock.json') }}
      - run: make install
      - name: the demo in headless Chromium, desktop and phone
        run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-playwright-report
          path: packages/viewer/playwright-report

  # The repository-wide hooks of .pre-commit-config.yaml: file hygiene, ruff. The package hooks (mypy, eslint) and
  # gitleaks run in the jobs above and below.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-pre-commit.txt
      - run: pip install --require-hashes -r .github/requirements-pre-commit.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks,mypy-records,mypy-updates,mypy-map-pipeline,viewer-lint

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

  # The one check to require on main. Jobs skipped because their package did not change count as passed.
  ci-ok:
    if: always()
    needs:
      - changes
      - records-check
      - records-e2e
      - updates-check
      - updates-e2e
      - map-pipeline-check
      - map-pipeline-e2e
      - viewer-check
      - viewer-e2e
      - pre-commit
      - secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

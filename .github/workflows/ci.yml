name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. On main every commit gets its own run: the path filter compares
# each push with the one before it, so a cancelled run would leave its changes untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Which packages a change touches. A change to shared files (CI, root config, examples) runs every package.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      records: ${{ steps.diff.outputs.records }}
      map-pipeline: ${{ steps.diff.outputs.map-pipeline }}
      viewer: ${{ steps.diff.outputs.viewer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BASE" HEAD)
          fi
          shared='^(\.github/|Makefile$|ruff\.toml$|eslint\.config\.mjs$|\.prettierrc\.json$|examples/)'
          for package in records map-pipeline viewer; do
            if printf '%s\n' "$changed" | grep -qE "^packages/$package/|$shared"; then
              echo "$package=true" >> "$GITHUB_OUTPUT"
            else
              echo "$package=false" >> "$GITHUB_OUTPUT"
            fi
          done

  # ---- packages/records ----

  records-check:
    needs: changes
    if: needs.changes.outputs.records == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    defaults:
      run:
        working-directory: packages/records
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/records/requirements-dev.txt
      - run: make install PYTHON=python
      - name: lint, types, unit and integration tests with coverage
        run: make check
      - name: the demo runs with no key and no network
        run: make demo
      - name: the wheel builds and carries its prompts
        run: make build

  records-e2e:
    needs: changes
    if: needs.changes.outputs.records == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/records
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/records/requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/records/requirements-dev.txt') }}
      - run: make install PYTHON=python
      - name: make demo, then the map preview in headless Chromium
        run: make e2e

  # ---- packages/map-pipeline: jobs are added with the package ----

  # ---- packages/viewer: jobs are added with the package ----

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

  # The one check to require on main. Jobs skipped because their package did not change count as passed.
  ci-ok:
    if: always()
    needs: [changes, records-check, records-e2e, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
